<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>輪唱プレイヤー 完全版</title>

<style>
body{
  font-family:system-ui,-apple-system,"メイリオ",sans-serif;
  background:#f6f8fa;
  padding:16px
}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.track{
  border:1px solid #ccc;
  background:#fff;
  padding:8px;
  margin:8px 0
}
button{padding:4px 8px}
input[type=range]{width:180px}
.small{font-size:12px;color:#555}
</style>
</head>

<body>
<h2>輪唱プレイヤー（最大5音源 / 100声）</h2>

<div class="row">
  <label>音源追加</label>
  <input id="file" type="file" multiple accept=".mp3,.mp4,audio/*,video/*">
</div>

<div class="row">
  <label>声の遅延</label>
  <input id="voiceDelay" type="range" min="0" max="1" step="0.001" value="0.200">
  <span id="voiceDelayLabel">0.200s</span>
  <button id="vdMinus">-</button>
  <button id="vdPlus">+</button>
</div>

<div class="row">
  <label>全体音量</label>
  <input id="masterVol" type="range" min="0" max="1" step="0.01" value="1">
  <span id="masterVolLabel">1.00</span>
</div>

<div class="row">
  <button id="play">再生</button>
  <button id="stop">停止</button>
</div>

<hr>

<div id="tracks"></div>

<p class="small">
・音源は最大5つ<br>
・声は合計100声まで<br>
・音源は自動で左右に配置
</p>

<script>
let audioCtx;
let masterGain;
let buffers=[];
let sources=[];

const fileEl=document.getElementById("file");
const tracksEl=document.getElementById("tracks");
const voiceDelayEl=document.getElementById("voiceDelay");
const voiceDelayLabel=document.getElementById("voiceDelayLabel");
const masterVolEl=document.getElementById("masterVol");
const masterVolLabel=document.getElementById("masterVolLabel");

function ensureCtx(){
  if(!audioCtx){
    audioCtx=new AudioContext();
    masterGain=audioCtx.createGain();
    masterGain.connect(audioCtx.destination);
  }
}

function hold(btn,fn){
  let t;
  btn.onmousedown=()=>{
    fn(); t=setInterval(fn,50);
  };
  btn.onmouseup=btn.onmouseleave=()=>clearInterval(t);
}

hold(vdMinus,()=>adjVoiceDelay(-0.001));
hold(vdPlus,()=>adjVoiceDelay(0.001));

function adjVoiceDelay(d){
  let v=+voiceDelayEl.value;
  v=Math.max(0,Math.min(1,v+d));
  voiceDelayEl.value=v.toFixed(3);
  voiceDelayLabel.textContent=v.toFixed(3)+"s";
}

voiceDelayEl.oninput=()=>voiceDelayLabel.textContent=(+voiceDelayEl.value).toFixed(3)+"s";
masterVolEl.oninput=()=>{
  masterGain.gain.value=masterVolEl.value;
  masterVolLabel.textContent=(+masterVolEl.value).toFixed(2);
};

fileEl.onchange=async()=>{
  ensureCtx();
  buffers=[];
  tracksEl.innerHTML="";
  const files=[...fileEl.files].slice(0,5);

  for(const f of files){
    const buf=await audioCtx.decodeAudioData(await f.arrayBuffer());
    buffers.push({
      name:f.name,
      buffer:buf,
      delay:0,
      voices:10,
      volume:1
    });
  }
  buildTracks();
};

function buildTracks(){
  tracksEl.innerHTML="";
  buffers.forEach((t,i)=>{
    const d=document.createElement("div");
    d.className="track";
    d.innerHTML=`
      <b>${t.name}</b>

      <div class="row">
        <label>音源遅延</label>
        <input data-d="${i}" type="range" min="0" max="5" step="0.001" value="0">
        <span>0.000s</span>
        <button data-m="${i}">-</button>
        <button data-p="${i}">+</button>
      </div>

      <div class="row">
        <label>音量</label>
        <input data-v="${i}" type="range" min="0" max="1" step="0.01" value="1">
      </div>

      <div class="row">
        <label>声の数</label>
        <input data-n="${i}" type="number" min="1" max="100" value="10">
      </div>
    `;
    tracksEl.appendChild(d);

    const r=d.querySelector("[data-d]");
    const s=r.nextElementSibling;
    r.oninput=()=>{t.delay=+r.value;s.textContent=r.value+"s"};

    hold(d.querySelector("[data-m]"),()=>{r.value=(+r.value-0.001).toFixed(3);r.oninput()});
    hold(d.querySelector("[data-p]"),()=>{r.value=(+r.value+0.001).toFixed(3);r.oninput()});

    d.querySelector("[data-v]").oninput=e=>t.volume=e.target.value;
    d.querySelector("[data-n]").oninput=e=>t.voices=e.target.value;
  });
}

play.onclick=()=>{
  ensureCtx();
  stop.onclick();

  const totalVoices=buffers.reduce((a,b)=>a+ +b.voices,0);
  if(totalVoices>100){alert("声が100超えてる");return;}

  const now=audioCtx.currentTime;
  const trackCount=buffers.length;

  buffers.forEach((t,ti)=>{
    const pan=trackCount===1?0:(ti/(trackCount-1))*2-1;
    const panner=audioCtx.createStereoPanner();
    panner.pan.value=pan;

    for(let i=0;i<t.voices;i++){
      const src=audioCtx.createBufferSource();
      const g=audioCtx.createGain();
      src.buffer=t.buffer;
      g.gain.value=t.volume;
      src.connect(g);
      g.connect(panner);
      panner.connect(masterGain);
      src.start(now+t.delay+i*voiceDelayEl.value);
      sources.push(src);
    }
  });
};

stop.onclick=()=>{
  sources.forEach(s=>{try{s.stop()}catch{}});
  sources=[];
};
</script>
</body>
</html>
