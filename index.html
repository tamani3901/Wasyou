<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>輪唱プレイヤー（完全版）</title>

<style>
body{
  font-family: system-ui;
  background:#f6f8fa;
  padding:16px;
}
h2{margin-top:0}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
input[type="range"]{width:220px}
.track{
  border:1px solid #ccc;
  padding:10px;
  margin:10px 0;
  background:#fff;
}
button{cursor:pointer}
.note{font-size:13px;color:#555}
</style>
</head>

<body>
<h2>輪唱プレイヤー</h2>

<div class="row">
  <label>全体音量</label>
  <input id="masterVol" type="range" min="0" max="1" step="0.01" value="1">
  <span id="masterVolLabel">1.00</span>
</div>

<div class="row">
  <label>声の遅延</label>
  <input id="voiceDelay" type="range" min="0" max="1" step="0.001" value="0.500">
  <span id="voiceDelayLabel">0.500s</span>
  <button id="vdMinus">-0.001</button>
  <button id="vdPlus">+0.001</button>
</div>

<div class="row">
  <label>ループ</label>
  <input id="loop" type="checkbox" checked>
</div>

<div id="tracks"></div>

<div class="row">
  <button id="play">再生</button>
  <button id="stop" disabled>停止</button>
</div>

<p class="note">
最大5音源 / 合計100声。  
音源は自動で左右に分離される。
</p>

<script>
let audioCtx, masterGain;
let tracks = [];
let activeSources = [];

function ensureCtx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.connect(audioCtx.destination);
  }
}

function holdButton(btn, delta, target, label){
  let t;
  const step=()=>{
    let v=parseFloat(target.value);
    v=Math.max(0,Math.min(1,v+delta));
    target.value=v.toFixed(3);
    label.textContent=v.toFixed(3)+"s";
  };
  btn.onmousedown=()=>{step();t=setInterval(step,50)};
  btn.onmouseup=btn.onmouseleave=()=>clearInterval(t);
  btn.ontouchstart=e=>{e.preventDefault();step();t=setInterval(step,80)};
  btn.ontouchend=()=>clearInterval(t);
}

/* 全体UI */
const voiceDelay=document.getElementById("voiceDelay");
const voiceDelayLabel=document.getElementById("voiceDelayLabel");
voiceDelay.oninput=()=>voiceDelayLabel.textContent=parseFloat(voiceDelay.value).toFixed(3)+"s";
holdButton(vdMinus,-0.001,voiceDelay,voiceDelayLabel);
holdButton(vdPlus, 0.001,voiceDelay,voiceDelayLabel);

masterVol.oninput=()=>{
  masterVolLabel.textContent=parseFloat(masterVol.value).toFixed(2);
  if(masterGain) masterGain.gain.value=masterVol.value;
};

/* トラックUI生成 */
const tracksDiv=document.getElementById("tracks");

for(let i=0;i<5;i++){
  const div=document.createElement("div");
  div.className="track";
  div.innerHTML=`
    <strong>音源 ${i+1}</strong><br>

    <div class="row">
      <input type="file" accept=".mp3,.mp4,audio/*,video/*">
    </div>

    <div class="row">
      <label>声の数</label>
      <input type="number" min="1" max="100" value="3">
    </div>

    <div class="row">
      <label>開始遅延</label>
      <input type="range" min="0" max="1" step="0.001" value="0">
      <span>0.000s</span>
      <button>-0.001</button>
      <button>+0.001</button>
    </div>

    <div class="row">
      <label>音量</label>
      <input type="range" min="0" max="1" step="0.01" value="1">
    </div>
  `;
  tracksDiv.appendChild(div);

  const file=div.querySelector('input[type=file]');
  const voices=div.querySelector('input[type=number]');
  const delay=div.querySelector('input[type=range]');
  const delayLabel=div.querySelector('span');
  const dMinus=div.querySelectorAll('button')[0];
  const dPlus=div.querySelectorAll('button')[1];
  const vol=div.querySelectorAll('input[type=range]')[1];

  delay.oninput=()=>delayLabel.textContent=parseFloat(delay.value).toFixed(3)+"s";
  holdButton(dMinus,-0.001,delay,delayLabel);
  holdButton(dPlus, 0.001,delay,delayLabel);

  tracks.push({file,voices,delay,vol,buffer:null});
}

/* 再生 */
play.onclick=async()=>{
  ensureCtx();
  if(audioCtx.state==="suspended") audioCtx.resume();
  stopAll();

  masterGain.gain.value=masterVol.value;
  const baseTime=audioCtx.currentTime;
  const loop=document.getElementById("loop").checked;

  const validTracks=tracks.filter(t=>t.file.files[0]);
  const totalTracks=validTracks.length;

  let totalVoices=0;

  for(let ti=0;ti<validTracks.length;ti++){
    const t=validTracks[ti];
    if(!t.buffer){
      const ab=await t.file.files[0].arrayBuffer();
      t.buffer=await audioCtx.decodeAudioData(ab);
    }

    const pan = totalTracks===1 ? 0 : (ti/(totalTracks-1))*2-1;

    for(let i=0;i<t.voices.value;i++){
      if(totalVoices>=100) break;
      totalVoices++;

      const src=audioCtx.createBufferSource();
      src.buffer=t.buffer;
      src.loop=loop;

      const gain=audioCtx.createGain();
      gain.gain.value=t.vol.value;

      const panner=audioCtx.createStereoPanner();
      panner.pan.value=pan;

      src.connect(gain);
      gain.connect(panner);
      panner.connect(masterGain);

      src.start(
        baseTime +
        parseFloat(t.delay.value) +
        i*parseFloat(voiceDelay.value)
      );

      activeSources.push(src);
    }
  }

  play.disabled=true;
  stop.disabled=false;
};

/* 停止 */
function stopAll(){
  activeSources.forEach(s=>{try{s.stop()}catch{}});
  activeSources=[];
  play.disabled=false;
  stop.disabled=true;
}
stop.onclick=stopAll;
</script>
</body>
</html>
