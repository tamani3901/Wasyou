<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>輪唱プレイヤー 完全版</title>

<style>
body{
  font-family:system-ui,-apple-system,"メイリオ",sans-serif;
  background:#f6f8fa;
  padding:16px
}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.track{
  border:1px solid #ccc;
  background:#fff;
  padding:8px;
  margin:10px 0
}
button{padding:4px 8px}
input[type=range]{width:180px}
.small{font-size:12px;color:#555}
</style>
</head>

<body>
<h2>輪唱プレイヤー（最大5音源・100声）</h2>

<div class="row">
  <label>音源追加</label>
  <input id="file" type="file" multiple accept=".mp3,.mp4,audio/*,video/*">
</div>

<div class="row">
  <label>声の遅延</label>
  <input id="voiceDelay" type="range" min="0" max="1" step="0.001" value="0.200">
  <span id="voiceDelayLabel">0.200s</span>
  <button id="vdMinus">-</button>
  <button id="vdPlus">+</button>
</div>

<div class="row">
  <label>全体音量</label>
  <input id="masterVol" type="range" min="0" max="1" step="0.01" value="1">
  <span id="masterVolLabel">1.00</span>
</div>

<div class="row">
  <button id="play">再生</button>
  <button id="stop">停止</button>
</div>

<hr>

<div id="tracks"></div>

<p class="small">
・音源は最大5つ<br>
・声は合計100声まで<br>
・±ボタンは長押し対応
</p>

<script>
let audioCtx;
let masterGain;
let buffers=[];
let sources=[];

const fileEl=document.getElementById("file");
const tracksEl=document.getElementById("tracks");
const voiceDelayEl=document.getElementById("voiceDelay");
const voiceDelayLabel=document.getElementById("voiceDelayLabel");
const masterVolEl=document.getElementById("masterVol");
const masterVolLabel=document.getElementById("masterVolLabel");

function ensureCtx(){
  if(!audioCtx){
    audioCtx=new AudioContext();
    masterGain=audioCtx.createGain();
    masterGain.connect(audioCtx.destination);
  }
}

// ===== 長押し共通 =====
function hold(btn,fn){
  let timer;
  const start=()=>{
    fn();
    timer=setInterval(fn,50);
  };
  const stop=()=>clearInterval(timer);

  btn.addEventListener("mousedown",start);
  btn.addEventListener("mouseup",stop);
  btn.addEventListener("mouseleave",stop);
  btn.addEventListener("touchstart",e=>{e.preventDefault();start();});
  btn.addEventListener("touchend",stop);
}

// ===== 声の遅延 =====
function updateVoiceDelay(){
  voiceDelayLabel.textContent=(+voiceDelayEl.value).toFixed(3)+"s";
}
voiceDelayEl.oninput=updateVoiceDelay;

hold(vdMinus,()=>{
  let v=+voiceDelayEl.value;
  v=Math.max(0,v-0.001);
  voiceDelayEl.value=v.toFixed(3);
  updateVoiceDelay();
});
hold(vdPlus,()=>{
  let v=+voiceDelayEl.value;
  v=Math.min(1,v+0.001);
  voiceDelayEl.value=v.toFixed(3);
  updateVoiceDelay();
});

// ===== 全体音量 =====
masterVolEl.oninput=()=>{
  masterGain.gain.value=masterVolEl.value;
  masterVolLabel.textContent=(+masterVolEl.value).toFixed(2);
};

// ===== ファイル読み込み =====
fileEl.onchange=async()=>{
  ensureCtx();
  buffers=[];
  tracksEl.innerHTML="";
  const files=[...fileEl.files].slice(0,5);

  for(const f of files){
    const buf=await audioCtx.decodeAudioData(await f.arrayBuffer());
    buffers.push({
      name:f.name,
      buffer:buf,
      delay:0,
      voices:10,
      volume:1
    });
  }
  buildTracks();
};

// ===== 音源UI生成 =====
function buildTracks(){
  tracksEl.innerHTML="";
  buffers.forEach((t,i)=>{
    const d=document.createElement("div");
    d.className="track";
    d.innerHTML=`
      <b>${t.name}</b>

      <div class="row">
        <label>音源遅延</label>
        <input type="range" min="0" max="5" step="0.001" value="0">
        <span>0.000s</span>
        <button>-</button>
        <button>+</button>
      </div>

      <div class="row">
        <label>音量</label>
        <input type="range" min="0" max="1" step="0.01" value="1">
      </div>

      <div class="row">
        <label>声の数</label>
        <input type="number" min="1" max="100" value="10">
      </div>
    `;
    tracksEl.appendChild(d);

    const delayRange=d.querySelector("input[type=range]");
    const delayLabel=delayRange.nextElementSibling;
    const minusBtn=delayLabel.nextElementSibling;
    const plusBtn=minusBtn.nextElementSibling;

    delayRange.oninput=()=>{
      t.delay=+delayRange.value;
      delayLabel.textContent=(+delayRange.value).toFixed(3)+"s";
    };

    hold(minusBtn,()=>{
      let v=+delayRange.value;
      v=Math.max(0,v-0.001);
      delayRange.value=v.toFixed(3);
      delayRange.oninput();
    });
    hold(plusBtn,()=>{
      let v=+delayRange.value;
      v=v+0.001;
      delayRange.value=v.toFixed(3);
      delayRange.oninput();
    });

    d.querySelectorAll("input[type=range]")[1]
      .oninput=e=>t.volume=e.target.value;

    d.querySelector("input[type=number]")
      .oninput=e=>t.voices=e.target.value;
  });
}

// ===== 再生 =====
play.onclick=()=>{
  ensureCtx();
  stop.onclick();

  const totalVoices=buffers.reduce((a,b)=>a+ +b.voices,0);
  if(totalVoices>100){
    alert("声の合計が100を超えてる");
    return;
  }

  const now=audioCtx.currentTime;
  const trackCount=buffers.length;

  buffers.forEach((t,ti)=>{
    const pan=trackCount===1?0:(ti/(trackCount-1))*2-1;
    const panner=audioCtx.createStereoPanner();
    panner.pan.value=pan;

    for(let i=0;i<t.voices;i++){
      const src=audioCtx.createBufferSource();
      const g=audioCtx.createGain();
      src.buffer=t.buffer;
      g.gain.value=t.volume;

      src.connect(g);
      g.connect(panner);
      panner.connect(masterGain);

      src.start(now+t.delay+i*voiceDelayEl.value);
      sources.push(src);
    }
  });
};

// ===== 停止 =====
stop.onclick=()=>{
  sources.forEach(s=>{try{s.stop()}catch{}});
  sources=[];
};
</script>
</body>
</html>
