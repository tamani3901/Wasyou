<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>輪唱プレイヤー（最大5音源・100声）</title>
<style>
  body{font-family:system-ui,-apple-system,"ヒラギノ角ゴ ProN","メイリオ",Meiryo,sans-serif;padding:16px;background:#f6f8fa}
  .row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
  label{min-width:90px}
  input[type="range"]{width:200px}
  #tracks{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .track{background:#fff;padding:8px;border-radius:6px;box-shadow:0 0 4px #0001}
  button{padding:4px 8px}
  .small{font-size:12px;color:#555}
  .fname{font-weight:600;word-break:break-all}
</style>
</head>
<body>

<h2>輪唱プレイヤー（最大5音源・100声）</h2>

<div class="row">
  <label>音源</label>
  <input id="file" type="file" multiple accept=".mp3,.mp4,audio/*,video/*">
</div>

<div class="row">
  <label>声遅延</label>
  <input id="delaySec" type="range" min="0" max="1" step="0.001" value="0.500">
  <span id="delayLabel">0.500s</span>
  <button id="delayMinus">-0.001</button>
  <button id="delayPlus">+0.001</button>
</div>

<div class="row">
  <label>全体音量</label>
  <input id="masterVol" type="range" min="0" max="1" step="0.01" value="1">
  <span id="volLabel">1.00</span>
</div>

<div class="row">
  <label>ループ</label>
  <input id="loop" type="checkbox" checked>
</div>

<div class="row">
  <button id="playBtn" disabled>再生</button>
  <button id="stopBtn" disabled>停止</button>
</div>

<div id="tracks"></div>

<p class="small">
音源ごとに「開始遅延・音量・声数」を設定可能。合計声数は最大100。
</p>

<script>
(()=>{
  let audioCtx=null;
  let masterGain=null;
  let activeSources=[];

  let audioBuffers=[];
  let fileNames=[];
  let trackDelays=[];
  let trackVolumes=[];
  let trackVoices=[];

  const fileEl=document.getElementById('file');
  const delaySecEl=document.getElementById('delaySec');
  const delayLabel=document.getElementById('delayLabel');
  const delayMinus=document.getElementById('delayMinus');
  const delayPlus=document.getElementById('delayPlus');
  const masterVolEl=document.getElementById('masterVol');
  const volLabel=document.getElementById('volLabel');
  const loopEl=document.getElementById('loop');
  const playBtn=document.getElementById('playBtn');
  const stopBtn=document.getElementById('stopBtn');
  const tracksDiv=document.getElementById('tracks');

  function ensureCtx(){
    if(!audioCtx){
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      masterGain=audioCtx.createGain();
      masterGain.gain.value=Number(masterVolEl.value);
      masterGain.connect(audioCtx.destination);
    }
  }

  function setupHold(btn,stepFn){
    let id;
    btn.onmousedown=()=>{stepFn();id=setInterval(stepFn,50)};
    btn.onmouseup=btn.onmouseleave=()=>clearInterval(id);
    btn.ontouchstart=e=>{e.preventDefault();stepFn();id=setInterval(stepFn,80)};
    btn.ontouchend=()=>clearInterval(id);
  }

  function updateDelayLabel(){
    delayLabel.textContent=parseFloat(delaySecEl.value).toFixed(3)+'s';
  }
  updateDelayLabel();
  delaySecEl.oninput=updateDelayLabel;

  setupHold(delayMinus,()=>{
    delaySecEl.value=Math.max(0,(+delaySecEl.value-0.001)).toFixed(3);
    updateDelayLabel();
  });
  setupHold(delayPlus,()=>{
    delaySecEl.value=Math.min(1,(+delaySecEl.value+0.001)).toFixed(3);
    updateDelayLabel();
  });

  masterVolEl.oninput=()=>{
    volLabel.textContent=Number(masterVolEl.value).toFixed(2);
    if(masterGain) masterGain.gain.value=Number(masterVolEl.value);
  };

  fileEl.onchange=async()=>{
    ensureCtx();
    audioBuffers=[];
    fileNames=[];
    trackDelays=[];
    trackVolumes=[];
    trackVoices=[];
    tracksDiv.innerHTML='';

    const files=[...fileEl.files].slice(0,5);
    for(const f of files){
      const ab=await f.arrayBuffer();
      const buf=await audioCtx.decodeAudioData(ab);
      audioBuffers.push(buf);
      fileNames.push(f.name);
      trackDelays.push(0);
      trackVolumes.push(1);
      trackVoices.push(Math.floor(100/files.length));
    }
    buildTracks();
    playBtn.disabled=false;
  };

  function buildTracks(){
    tracksDiv.innerHTML='';
    audioBuffers.forEach((_,i)=>{
      const d=document.createElement('div');
      d.className='track';
      d.innerHTML=`
        <div class="fname">${fileNames[i]}</div>

        開始遅延
        <input type="range" min="0" max="10" step="0.001" value="${trackDelays[i]}">
        <span>${trackDelays[i].toFixed(3)}s</span>
        <button>-0.001</button>
        <button>+0.001</button>
        <br>

        音量
        <input type="range" min="0" max="1" step="0.01" value="${trackVolumes[i]}">
        <span>${trackVolumes[i].toFixed(2)}</span>
        <br>

        声数
        <input type="number" min="0" max="100" value="${trackVoices[i]}" style="width:60px">
      `;

      const [delayRange,delayLabelSpan,minusBtn,plusBtn,
             volRange,volLabelSpan,
             voiceInput] = d.querySelectorAll('input,span,button');

      delayRange.oninput=e=>{
        trackDelays[i]=Number(e.target.value);
        delayLabelSpan.textContent=trackDelays[i].toFixed(3)+'s';
      };

      setupHold(minusBtn,()=>{
        trackDelays[i]=Math.max(0,trackDelays[i]-0.001);
        delayRange.value=trackDelays[i].toFixed(3);
        delayLabelSpan.textContent=trackDelays[i].toFixed(3)+'s';
      });

      setupHold(plusBtn,()=>{
        trackDelays[i]=Math.min(10,trackDelays[i]+0.001);
        delayRange.value=trackDelays[i].toFixed(3);
        delayLabelSpan.textContent=trackDelays[i].toFixed(3)+'s';
      });

      volRange.oninput=e=>{
        trackVolumes[i]=Number(e.target.value);
        volLabelSpan.textContent=trackVolumes[i].toFixed(2);
      };

      voiceInput.oninput=e=>{
        trackVoices[i]=Number(e.target.value)||0;
        limitVoices();
      };

      tracksDiv.appendChild(d);
    });
  }

  function limitVoices(){
    let sum=trackVoices.reduce((a,b)=>a+b,0);
    if(sum<=100)return;
    let over=sum-100;
    for(let i=trackVoices.length-1;i>=0&&over>0;i--){
      const cut=Math.min(trackVoices[i],over);
      trackVoices[i]-=cut;
      tracksDiv.querySelectorAll('.track')[i]
        .querySelector('input[type=number]').value=trackVoices[i];
      over-=cut;
    }
  }

  function stop(){
    activeSources.forEach(s=>{try{s.stop()}catch{}});
    activeSources=[];
    stopBtn.disabled=true;
    playBtn.disabled=false;
  }

  function play(){
    ensureCtx();
    stop();
    const now=audioCtx.currentTime;
    const voiceDelay=parseFloat(delaySecEl.value);

    audioBuffers.forEach((buf,t)=>{
      for(let v=0;v<trackVoices[t];v++){
        const src=audioCtx.createBufferSource();
        const g=audioCtx.createGain();
        src.buffer=buf;
        src.loop=loopEl.checked;
        g.gain.value=trackVolumes[t];
        src.connect(g);
        g.connect(masterGain);
        src.start(now+trackDelays[t]+v*voiceDelay);
        activeSources.push(src);
      }
    });

    playBtn.disabled=true;
    stopBtn.disabled=false;
  }

  playBtn.onclick=play;
  stopBtn.onclick=stop;
})();
</script>

</body>
</html>
