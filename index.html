<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>輪唱プレイヤー（長押し調整対応）</title>
<style>
  body{font-family:system-ui,-apple-system,"ヒラギノ角ゴ ProN","Hiragino Kaku Gothic ProN","メイリオ",Meiryo,sans-serif;padding:18px;background:#f6f8fa}
  .row{display:flex;gap:8px;align-items:center;margin:8px 0}
  label{min-width:110px}
  input[type="range"]{width:220px}
  #voicesContainer{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:60vh;overflow-y:auto}
  .voice-item{display:flex;gap:8px;align-items:center}
  button{padding:4px 8px;cursor:pointer}
  .note{font-size:13px;color:#555}
</style>
</head>
<body>
  <h2>輪唱プレイヤー（最大100声・長押し調整対応）</h2>

  <div class="row">
    <label>MP3/MP4ファイル</label>
    <input id="file" type="file" accept=".mp3, .mp4, audio/*, video/*">
  </div>

  <div class="row">
    <label>声の数</label>
    <input id="numVoices" type="number" min="1" max="250" value="3" style="width:70px">
  </div>

  <div class="row">
    <label>遅延（秒）</label>
    <input id="delaySec" type="range" min="0" max="1" step="0.001" value="1.000">
    <span id="delayLabel">1.000s</span>
    <button id="delayMinus">-0.001</button>
    <button id="delayPlus">+0.001</button>
  </div>

  <div class="row">
    <label>音量</label>
    <input id="masterVol" type="range" min="0" max="1" step="0.01" value="1.0">
    <span id="volLabel">1.0</span>
  </div>

  <div class="row">
    <label>ループ</label>
    <input id="loop" type="checkbox" checked>
  </div>

  <div class="row">
    <button id="playBtn">再生</button>
    <button id="stopBtn" disabled>停止</button>
    <button id="previewBtn" disabled>1声プレビュー</button>
  </div>

  <div id="voicesContainer"></div>

  <p class="note">0.001秒単位で遅延を設定可能。長押しで連続調整も可能。最大250声まで同時に輪唱。</p>

<script>
(async()=>{
  let audioCtx=null,audioBuffer=null,activeSources=[],masterGain=null;
  const fileEl=document.getElementById('file');
  const numVoicesEl=document.getElementById('numVoices');
  const delaySecEl=document.getElementById('delaySec');
  const delayLabel=document.getElementById('delayLabel');
  const delayMinusBtn=document.getElementById('delayMinus');
  const delayPlusBtn=document.getElementById('delayPlus');
  const masterVolEl=document.getElementById('masterVol');
  const volLabel=document.getElementById('volLabel');
  const loopEl=document.getElementById('loop');
  const playBtn=document.getElementById('playBtn');
  const stopBtn=document.getElementById('stopBtn');
  const previewBtn=document.getElementById('previewBtn');
  const voicesContainer=document.getElementById('voicesContainer');

  function ensureAudioCtx(){
    if(!audioCtx){
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      masterGain=audioCtx.createGain();
      masterGain.gain.value=Number(masterVolEl.value);
      masterGain.connect(audioCtx.destination);
    }
  }

  // 遅延ラベル更新
  function updateDelayLabel(){
    delayLabel.textContent=parseFloat(delaySecEl.value).toFixed(3)+'s';
  }

  delaySecEl.addEventListener('input',updateDelayLabel);

  // 長押し処理用
  function setupHoldButton(button,delta){
    let interval;
    const step=()=>{ 
      let v=parseFloat(delaySecEl.value);
      v=Math.min(1,Math.max(0,v+delta));
      delaySecEl.value=v.toFixed(3);
      updateDelayLabel();
    };
    button.addEventListener('mousedown',()=>{
      step();
      interval=setInterval(step,50); // 50msごとに連続調整
    });
    button.addEventListener('mouseup',()=>clearInterval(interval));
    button.addEventListener('mouseleave',()=>clearInterval(interval));
    button.addEventListener('touchstart',e=>{e.preventDefault();step();interval=setInterval(step,80);});
    button.addEventListener('touchend',()=>clearInterval(interval));
  }

  setupHoldButton(delayMinusBtn,-0.001);
  setupHoldButton(delayPlusBtn,+0.001);

  // 音量
  masterVolEl.addEventListener('input',()=>{
    volLabel.textContent=Number(masterVolEl.value).toFixed(2);
    if(masterGain) masterGain.gain.value=Number(masterVolEl.value);
  });

  // ファイル読み込み
  fileEl.addEventListener('change',async()=>{
    const file=fileEl.files&&fileEl.files[0];
    if(!file)return;
    ensureAudioCtx();
    const ab=await file.arrayBuffer();
    try{audioBuffer=await audioCtx.decodeAudioData(ab);}
    catch(e){audioBuffer=await new Promise((res,rej)=>{audioCtx.decodeAudioData(ab,res,rej)});}
    previewBtn.disabled=false;
    playBtn.disabled=false;
    buildVoiceControls();
  });

  // 声スライダー生成
  function buildVoiceControls(){
    voicesContainer.innerHTML='';
    const n=Math.max(1,Math.min(100,Number(numVoicesEl.value)));
    for(let i=0;i<n;i++){
      const div=document.createElement('div');
      div.className='voice-item';
      div.innerHTML=`
        <strong>声 ${i+1}</strong>
        <label style="margin-left:8px">パン</label>
        <input data-idx="${i}" type="range" min="-1" max="1" step="0.01" value="${(n===1?0:(i/(n-1))*2-1).toFixed(2)}">
        <label>音量</label>
        <input data-idx-vol="${i}" type="range" min="0" max="1" step="0.01" value="1">
      `;
      voicesContainer.appendChild(div);
    }
  }
  numVoicesEl.addEventListener('change',buildVoiceControls);

  // 再生
  function startPlayback(singlePreview=false){
    if(!audioBuffer)return;
    ensureAudioCtx();
    stopPlayback();
    const now=audioCtx.currentTime;
    const n=Math.max(1,Math.min(100,Number(numVoicesEl.value)));
    const delay=parseFloat(delaySecEl.value);
    const shouldLoop=loopEl.checked;

    for(let i=0;i<n;i++){
      if(singlePreview && i>0) break;
      const src=audioCtx.createBufferSource();
      src.buffer=audioBuffer;
      src.loop=shouldLoop;
      const gain=audioCtx.createGain();
      gain.gain.value=Number(document.querySelector(`input[data-idx-vol="${i}"]`)?.value??1);
      const pan=audioCtx.createStereoPanner?audioCtx.createStereoPanner():null;
      if(pan){
        const panInput=document.querySelector(`input[data-idx="${i}"]`);
        pan.pan.value=panInput?Number(panInput.value):0;
      }
      src.connect(gain);
      if(pan) gain.connect(pan),pan.connect(masterGain); else gain.connect(masterGain);
      const startAt=now+i*delay;
      try{src.start(startAt);}catch{src.start();}
      activeSources.push({src,gain,pan});
    }
    stopBtn.disabled=false;
    playBtn.disabled=true;
  }

  // 停止
  function stopPlayback(){
    activeSources.forEach(o=>{
      try{o.src.stop()}catch{}
      try{o.src.disconnect()}catch{}
      try{o.gain.disconnect()}catch{}
      if(o.pan)try{o.pan.disconnect()}catch{}
    });
    activeSources=[];
    stopBtn.disabled=true;
    playBtn.disabled=false;
  }

  // イベント
  playBtn.addEventListener('click',()=>{
    ensureAudioCtx();
    if(audioCtx.state==='suspended') audioCtx.resume();
    startPlayback(false);
  });
  previewBtn.addEventListener('click',()=>{
    ensureAudioCtx();
    if(audioCtx.state==='suspended') audioCtx.resume();
    startPlayback(true);
  });
  stopBtn.addEventListener('click',stopPlayback);
  buildVoiceControls();
  window.addEventListener('visibilitychange',()=>{if(document.hidden) stopPlayback();});
})();
</script>
</body>
</html>
